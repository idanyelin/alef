<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e6">
  <meta name="mobile-web-app-capable" content="yes">
  <title>א</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen">
      <div id="field"></div>
      <div id="jarArea">
        <div id="jar">
          <div id="jarLid"></div>
          <div id="jarBody"></div>
          <div id="jarStickers"></div>
        </div>
      </div>
      <div id="parentDot" aria-hidden="true"></div>
    </section>

    <section id="story" class="screen">
      <button id="backBtn" aria-label="חזרה"></button>
      <div id="storyLetter" class="bigletter"></div>
      <div id="storyFrame">
        <img id="picA" class="pic" alt="">
        <img id="picB" class="pic" alt="">
      </div>
    </section>

    <section id="say" class="screen">
      <div id="sayLetter" class="bigletter"></div>
    </section>

    <section id="find" class="screen">
      <div id="choices"></div>
    </section>
  </main>

  <div id="parent" hidden></div>

  <script src="lib/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
