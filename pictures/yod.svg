    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .09 0"/>
  </filter>
  <filter id="wob1"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="20"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
  <filter id="wob2"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="27"/><feDisplacementMap in="SourceGraphic" scale="4.5"/></filter>
  <filter id="soft"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
  <pattern id="h-dark" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="7" height="7" fill="#6f6a64" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#56524e" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-dgreen" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(58)"><rect width="7" height="7" fill="#93c08e" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#72956e" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-orange" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(41)"><rect width="7" height="7" fill="#f5bd8c" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#bf936d" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-sky" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(64)"><rect width="7" height="7" fill="#cfe3f1" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#a1b1bb" stroke-width="1.3" stroke-opacity=".55"/></pattern>
</defs>
<style>
