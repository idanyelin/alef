  <filter id="soft"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="24"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
  <pattern id="h-brown" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="7" height="7" fill="#d9b590" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#a98d70" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-cream" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(58)"><rect width="7" height="7" fill="#f8edd6" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#c1b8a6" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-dark" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(41)"><rect width="7" height="7" fill="#6f6a64" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#56524e" stroke-width="1.3" stroke-opacity=".55"/></pattern><pattern id="h-dbrown" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(64)"><rect width="7" height="7" fill="#b98f6a" fill-opacity=".6"/><path d="M0 0 V7 M3.5 0 V7" stroke="#906f52" stroke-width="1.3" stroke-opacity=".55"/></pattern>
</defs>
