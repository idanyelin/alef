    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .09 0"/>
  </filter>
  <filter id="wob1"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
  <filter id="wob2"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="36"/><feDisplacementMap in="SourceGraphic" scale="4.5"/></filter>
  <filter id="soft"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="32"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
